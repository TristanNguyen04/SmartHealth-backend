spring.application.name=Smart Health - Backend Service

# PostgreSQL Configuration
spring.datasource.url=jdbc:your-url-endpoint-to-hosted-database:5432/your-database-name
spring.datasource.username=username-to-connect-to-database
spring.datasource.password=password-to-connect-to-database
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework=DEBUG
logging.level.hibernate.resource=INFO
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

aws.s3.bucket-name=your-bucket-name
aws.s3.region=region-of-your-bucket
aws.s3.access-key=your-access-key
aws.s3.secret-key=your-secret-key
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
